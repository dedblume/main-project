<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<!-- HEADER -->
<body>
    <section>
        <nav>
            <div class="logo">
                <img src="./assets/fes-logo.png" alt="Frontend Simplified Logo" class="logo__img" width="50">
                <h1 class="logo__text"><b>Frontend</b> Simplified
                </h1>
            </div>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#social">Social</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>

        <header>
            <div class="row row__course">
                <div class="course">
                    <h1 class="course__icon">💾</h1>
                    <div class="course__text">
                        <div class="course__selection">----YOUR COURSE----</div>
                        <div class="course__title">Software Engineering</div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="hero">
                    <figure class="hero__img--wrapper">
                        <img src="./assets/laptop.png" alt="Frontend Simplified Hero Image" class="hero__img">
                    </figure>
                    <div class="hero__description">
                        <h1>Best place to learn frontend</h1>
                        <p class="subheader">Go from absolute beginner to pro with a simplified process</p>
                        <a href="#about">
                            <button class="hero__description--button">
                                ▷ LEARN MORE</button>
                        </a>
                    </div>
                </div>
            </div>
        </header>

    </section>

    <main>
        <section id="about">
            <div class="row about__row">
                <div class="section__card section__card--about">
                    <h1 class="section__title">About</h1>
                    <div class="section__description">
                        <div class="section_description--wrapper">

                        </div>
                    </div>
                </div>
            </div>
            


    </main>

</body>

</html>
